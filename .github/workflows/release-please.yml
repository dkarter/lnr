name: Release Please

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'

      - name: Run tests
        run: go test ./...

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        # v7.0.0 is an immutable release.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install aube
        uses: ./.github/actions/setup-aube

      - name: Build website
        run: |
          aube --dir website install --frozen-lockfile
          ./scripts/build-versioned-website.sh

  release-please:
    if: ${{ github.event_name == 'push' }}
    needs: [test, website]
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate release app token
        id: release_app_token
        # actions/create-github-app-token v3.2.0 is an immutable release tag; verify immutability before updating:
        # https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Use a GitHub App token instead of GITHUB_TOKEN so the release PR
          # can trigger downstream workflows.
          token: ${{ steps.release_app_token.outputs.token }}

      # Build and upload binaries if a release was created
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created }}
        # v7.0.0 is an immutable release.
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'

      - name: Run GoReleaser
        if: ${{ steps.release.outputs.release_created }}
        # v7.2.3 is an immutable release.
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ steps.release.outputs.release_created }}
        # v4.2.0 is an immutable GitHub release.
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Publish release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: release-please
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
