name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - scripts/build-versioned-website.sh
      - website/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node
        # v7.0.0 is an immutable release.
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install aube
        uses: ./.github/actions/setup-aube

      - name: Install dependencies
        run: aube --dir website install --frozen-lockfile

      - name: Build stable and development docs
        run: ./scripts/build-versioned-website.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
